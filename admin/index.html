<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mvrk Spence | Site Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/stuff/img/Iconlogo.png" type="image/png">
</head>
<body>
  <noscript><p>Enable JavaScript to sign in and edit the website.</p></noscript>
  <p id="editor-status" role="status">Loading the website editor...</p>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            window.location.href = '/admin/';
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    const editorStatus = document.getElementById('editor-status');
    if (window.CMS) {
      editorStatus.remove();
    } else {
      editorStatus.textContent = 'The editor could not load. Check your connection and reload this page.';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Reload editor';
      retry.addEventListener('click', () => window.location.reload());
      editorStatus.append(document.createTextNode(' '), retry);
    }
  </script>
  <script src="/admin/preview.js"></script>
</body>
</html>
