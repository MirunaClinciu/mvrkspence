<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mvrk Spence | Site Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <script id="legacy-payment-route">
    (function () {
      function redirectLegacyPayments() {
        if (window.location.hash.replace(/\/$/, '') === '#/collections/shop/entries/payments') {
          window.location.replace('/manage/paypal.html');
        }
      }
      redirectLegacyPayments();
      window.addEventListener('hashchange', redirectLegacyPayments);
    }());
  </script>
  <link rel="icon" href="/stuff/img/Iconlogo.png" type="image/png">
  <link rel="stylesheet" href="/admin/editor-navigation.css">
</head>
<body>
  <nav class="editor-shortcuts" aria-label="Website editor help">
    <a href="/manage/">Website dashboard</a>
    <a href="/admin/guide.html">Help with editing</a>
    <a href="/manage/paypal.html">PayPal settings</a>
    <a href="/preview/" target="_blank" rel="noopener">View website</a>
  </nav>
  <noscript><p>Enable JavaScript to sign in and edit the website.</p></noscript>
  <p id="editor-status" role="status">Loading the website editor...</p>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            const editorHash = window.location.hash;
            window.location.href = editorHash.startsWith('#/collections/') || editorHash === '#/workflow'
              ? `/admin/${editorHash}`
              : '/admin/';
          });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    const editorStatus = document.getElementById('editor-status');
    if (window.CMS) {
      editorStatus.remove();
    } else {
      editorStatus.textContent = 'The editor could not load. Check your connection and reload this page.';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Reload editor';
      retry.addEventListener('click', () => window.location.reload());
      editorStatus.append(document.createTextNode(' '), retry);
    }
  </script>
  <script src="/admin/validation.js"></script>
  <script src="/admin/preview.js"></script>
</body>
</html>
