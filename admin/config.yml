backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow
media_folder: uploads
public_folder: /uploads
locale: en
display_url: /preview/
logo_url: /stuff/img/logo.png

collections:
  - name: site
    label: Website setup
    files:
      - name: site-settings
        label: Logo, social links & footer
        file: content/site.json
        format: json
        fields:
          - { name: siteName, label: Website name, widget: string }
          - { name: metaDescription, label: Search description, widget: text }
          - { name: logo, label: Website logo, widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
          - { name: logoAlt, label: Logo description, widget: string }
          - { name: favicon, label: Browser tab icon, widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
          - name: navigation
            label: Navigation links
            widget: list
            collapsed: true
            summary: '{{fields.label}}'
            hint: Add, remove, or reorder links in the site navigation.
            fields:
              - { name: label, label: Link text, widget: string }
              - name: page
                label: Website page
                widget: select
                options:
                  - { label: Home, value: index.html }
                  - { label: Concept, value: concept.html }
                  - { label: Artwork & shop, value: artwork.html }
                  - { label: Contact, value: contact.html }
          - { name: footerText, label: Footer text, widget: string }
          - name: footerLinks
            label: Social links & icons
            label_singular: Social link
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.label}}'
            hint: Add, remove, or reorder the icons shown on the website and coming-soon page. Choose an icon and enter the profile URL or email address.
            fields:
              - name: platform
                label: Social icon
                widget: select
                required: false
                default: link
                options:
                  - { label: Instagram, value: instagram }
                  - { label: Facebook, value: facebook }
                  - { label: Email, value: email }
                  - { label: Buy Me a Coffee, value: buymeacoffee }
                  - { label: Other link, value: link }
              - { name: label, label: Link name, widget: string, hint: 'The accessible name for the icon, such as Instagram or Facebook.' }
              - { name: url, label: Profile URL or email address, widget: string, hint: 'For social profiles, paste the complete https:// address. For Email, enter name@example.com; mailto:name@example.com also works.', pattern: [ '^(?![\s\S]*\s)(?:https://[^\s]+|(?:mailto:)?[^\s@]+@[^\s@]+\.[^\s@]+)$', 'Enter a complete https:// profile URL or email address, without spaces.' ] }
      - name: coming-soon
        label: Coming soon page
        file: content/coming-soon.json
        format: json
        fields:
          - { name: logo, label: Logo photo, widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
          - { name: logoAlt, label: Logo description, widget: string }
          - { name: favicon, label: Browser tab icon, widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
          - { name: message, label: Main message, widget: string }
          - { name: intro, label: Short message below the heading, widget: text, required: false }
          - { name: footerText, label: Footer text, widget: string }

  - name: pages
    label: Website pages
    files:
      - name: home
        label: Home page
        file: content/home.json
        format: json
        fields:
          - name: cards
            label: Homepage image links
            widget: list
            collapsed: true
            summary: '{{fields.title}}'
            label_singular: Image link
            hint: Add, remove, or reorder the full-width photos on the original portfolio homepage.
            fields:
              - { name: title, label: Accessible image-link name, widget: string }
              - { name: image, label: Full-width photo (upload from computer), widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: alt, label: Image description, widget: string, required: false }
              - name: link
                label: Link to page
                widget: select
                options:
                  - { label: Artwork & shop, value: artwork.html }
                  - { label: Concept, value: concept.html }
                  - { label: Contact, value: contact.html }
      - name: concept
        label: Concept page & journal
        file: content/concept.json
        format: json
        fields:
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Main heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: bodyHeading, label: Main section heading, widget: string }
          - { name: body, label: Main content, widget: text }
          - { name: image, label: Main photo (upload from computer), widget: image, required: false, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
          - { name: imageAlt, label: Main photo description, widget: string, required: false }
          - name: gallery
            label: Concept photo gallery
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.caption}}'
            label_singular: Photo
            hint: Add, remove, or reorder gallery photos.
            fields:
              - { name: image, label: Gallery photo (upload from computer), widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: alt, label: Image description, widget: string, required: false }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: posts
            label: Journal posts
            label_singular: Post
            widget: list
            required: false
            default: []
            collapsed: true
            add_to_top: true
            summary: '{{fields.title}} - {{fields.date}}'
            hint: 'Add an update, project story or studio note. Switch Published on when ready, then publish this Concept page. Newest posts appear first. Delete a post here to remove it from the site.'
            fields:
              - { name: id, label: Permanent post ID, widget: hidden, required: false, default: "" }
              - { name: title, label: Post title, widget: string }
              - { name: date, label: Post date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, default: '{{now}}' }
              - { name: summary, label: Short introduction, widget: text, required: false }
              - { name: body, label: Post text, widget: text, hint: 'Plain text. Leave a blank line between paragraphs.' }
              - { name: image, label: Post photo (upload from computer), widget: image, required: false, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: imageAlt, label: Post photo description, widget: string, required: false }
              - { name: published, label: Published on the website, widget: boolean, default: false }
      - name: contact
        label: Contact page
        file: content/contact.json
        format: json
        fields:
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Main heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: email, label: Contact email address, widget: string, hint: 'Enter the complete email address visitors should use, such as hello@example.com.', pattern: [ '^[^\s@]+@[^\s@]+\.[^\s@]+$', 'Enter a complete email address, such as hello@example.com.' ] }
          - { name: emailLabel, label: Email section heading, widget: string, required: false, default: Direct enquiries }
          - { name: emailButtonLabel, label: Email button text, widget: string, required: false, default: Send an email, hint: "Opens the visitor's email app." }
          - { name: details, label: Additional contact information, widget: text }
          - { name: socialTitle, label: Social links heading, widget: string, required: false, default: Find me elsewhere }
          - { name: useSiteSocialLinks, label: Use the website social icons, widget: boolean, default: true, hint: 'Keep on to use the profiles under Website setup → Logo, social links & footer → Social links & icons. Switch off to use the custom contact links below.' }
          - name: socialLinks
            label: Custom contact links
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.label}}'
            hint: 'Optional. These icons appear only when Use the website social icons is switched off.'
            fields:
              - name: platform
                label: Social icon
                widget: select
                required: false
                default: link
                options:
                  - { label: Instagram, value: instagram }
                  - { label: Facebook, value: facebook }
                  - { label: Email, value: email }
                  - { label: Buy Me a Coffee, value: buymeacoffee }
                  - { label: Other link, value: link }
              - { name: label, label: Link name, widget: string, hint: 'The accessible name for the icon, such as Instagram or Facebook.' }
              - { name: url, label: Profile URL or email address, widget: string, hint: 'For social profiles, paste the complete https:// address. For Email, enter name@example.com; mailto:name@example.com also works.', pattern: [ '^(?![\s\S]*\s)(?:https://[^\s]+|(?:mailto:)?[^\s@]+@[^\s@]+\.[^\s@]+)$', 'Enter a complete https:// profile URL or email address, without spaces.' ] }

  - name: shop
    label: Artwork & books
    files:
      - name: shop
        label: Photographs & shop settings
        file: content/shop.json
        format: json
        fields:
          - name: photographs
            label: Photographs & artwork
            label_singular: Photograph
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.name}}'
            hint: 'Add a photograph, give it a title and choose its image. Four formats are prepared for you. Edit the sizes and prices, or remove formats you do not want. Switch off Show this photograph to hide it without deleting it.'
            fields:
              - { name: id, label: Photograph reference, widget: hidden, required: false, default: "" }
              - { name: name, label: Photograph title, widget: string }
              - { name: description, label: About this photograph, widget: text, required: false, hint: "Optional. Tell visitors about the artwork, materials or printing." }
              - { name: image, label: Photograph (upload once from computer), widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: imageAlt, label: Photograph description, widget: string, required: false }
              - { name: available, label: Show this photograph on Artwork, widget: boolean, default: true, hint: 'Switch off to hide the photograph and all its formats from sale.' }
              - name: variants
                label: Formats & sizes
                label_singular: Format
                widget: list
                required: false
                default:
                  - id: ""
                    format: print
                    option: A3
                    price: 0
                    purchasable: false
                    available: true
                  - id: ""
                    format: tshirt
                    option: M
                    price: 0
                    purchasable: false
                    available: true
                  - id: ""
                    format: framed
                    option: 30 x 40 cm
                    price: 0
                    purchasable: false
                    available: true
                  - id: ""
                    format: canvas
                    option: 40 x 60 cm
                    price: 0
                    purchasable: false
                    available: true
                collapsed: true
                summary: '{{fields.format}} - {{fields.option}} - {{fields.price}}'
                hint: 'Keep the formats you want. Set a price, then switch on Enable checkout to sell. Add another format for each extra size. Remove deletes only that format.'
                fields:
                  - { name: id, label: Format reference (unique), widget: hidden, required: false, default: "" }
                  - name: format
                    label: Product format
                    widget: select
                    default: print
                    options:
                      - { label: Art print, value: print }
                      - { label: T-shirt, value: tshirt }
                      - { label: Framed print, value: framed }
                      - { label: Canvas, value: canvas }
                  - { name: option, label: Size or option, widget: string, required: false, hint: 'For example A3, 30 x 40 cm, or T-shirt size M. Describe materials and other details in the photograph description.' }
                  - { name: price, label: Price for this format, widget: number, value_type: float, min: 0, step: 0.01, default: 0, required: false, hint: 'Enter the real price as a number in the shop currency, such as 25 for GBP 25.00.' }
                  - { name: purchasable, label: Enable checkout for this format, widget: boolean, default: false, hint: 'Leave off to accept enquiries. Set a price above zero before switching checkout on.' }
                  - { name: available, label: Offer this format, widget: boolean, default: true, hint: 'Switch off to hide this format or size and prevent checkout.' }
            add_to_top: true
          - { name: eyebrow, label: Small heading, widget: string }
          - { name: title, label: Shop page heading, widget: string }
          - { name: intro, label: Shop introduction, widget: text }
          - { name: photographsTitle, label: Photographs section heading, widget: string, required: false, default: Photographs & artwork }
          - { name: photographsIntro, label: Photographs section introduction, widget: text, required: false, default: 'Choose a photograph, then choose a print, T-shirt, frame or canvas.' }
          - { name: emptyTitle, label: Empty shop heading, widget: string }
          - { name: emptyMessage, label: Empty shop message, widget: text }
          - { name: testMode, label: Test shop with sample products, widget: boolean, default: true, hint: "Keep on while testing sample prices. Payments are restricted to PayPal sandbox. Turn off only when real products and prices are ready." }
          - name: currency
            label: Display and checkout currency
            widget: select
            options: [ USD, GBP, EUR, CAD, AUD, NZD, CHF, SGD ]
          - name: shipping
            label: Shipping charge
            widget: object
            fields:
              - { name: enabled, label: Charge a flat shipping fee for physical items, widget: boolean, default: false }
              - { name: amount, label: Shipping fee per order, widget: number, value_type: float, min: 0, step: 0.01 }
            collapsed: true
          - name: products
            label: Other / existing products
            label_singular: Product
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.name}} - {{fields.price}}'
            hint: 'Existing standalone listings are kept here. For a new photograph with several product formats, use Photographs & artwork above. Add books in the separate Books editor.'
            fields:
              - { name: id, label: Unique product ID, widget: hidden, required: false, default: "" }
              - { name: name, label: Product name, widget: string }
              - { name: description, label: Product description, widget: text }
              - { name: purchasable, label: Enable PayPal checkout, widget: boolean, default: false, hint: 'Leave off to display this piece with an enquiry link. Set its real price above zero before enabling checkout.' }
              - { name: price, label: Price per item, widget: number, value_type: float, min: 0, step: 0.01, default: 0, required: false, hint: 'Enter the real price in the selected shop currency, using up to two decimal places. A zero price is an enquiry listing.' }
              - name: type
                label: Item type
                widget: select
                options:
                  - { label: Physical item (requires shipping), value: physical }
                  - { label: Digital item (no shipping), value: digital }
                default: physical
              - { name: image, label: Product photo (upload from computer), widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: imageAlt, label: Product photo description, widget: string, required: false }
              - { name: available, label: Show on Artwork page, widget: boolean, default: true, hint: 'Switch off to hide a sold or withdrawn piece and prevent checkout.' }
      - name: books
        label: Books
        file: content/books.json
        format: json
        fields:
          - name: books
            label: Books
            label_singular: Book
            widget: list
            required: false
            default: []
            collapsed: true
            summary: '{{fields.name}} - {{fields.price}}'
            hint: 'Add a book, enter its title and choose a cover. Set a price and enable checkout to sell, or leave checkout off for enquiries. Use Remove to delete the listing; its cover stays in your image library.'
            fields:
              - { name: id, label: Book reference (unique), widget: hidden, required: false, default: "" }
              - { name: name, label: Book title, widget: string }
              - { name: description, label: Book description, widget: text, hint: 'Describe the edition, binding, page count and dimensions where relevant.', required: false }
              - { name: image, label: Book cover (upload from computer), widget: image, choose_url: false, hint: "Choose an image to upload a file or pick from your library. Replace image changes it. To remove a whole photo or artwork, use Remove on its list item." }
              - { name: imageAlt, label: Book cover description, widget: string, required: false }
              - { name: price, label: Price per book, widget: number, value_type: float, min: 0, step: 0.01, default: 0, required: false, hint: 'Enter the price as a number in the shop currency. Set a price above zero before enabling checkout.' }
              - { name: purchasable, label: Enable PayPal checkout, widget: boolean, default: false, hint: 'Leave off to accept book enquiries instead of purchases.' }
              - { name: type, label: Item type, widget: hidden, default: physical }
              - { name: available, label: Show this book, widget: boolean, default: true, hint: 'Switch off to hide a sold-out or withdrawn book and prevent checkout.' }
            add_to_top: true
          - { name: title, label: Books section heading, widget: string }
          - { name: intro, label: Books introduction, widget: text, required: false }
